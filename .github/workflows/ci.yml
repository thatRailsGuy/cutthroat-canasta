name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Lint, format, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Includes the axe-core checks in jsdom (apps/web/test/axe.test.tsx).
      - run: npm test

  axe-browser:
    name: Accessibility in Chromium
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      # Starts wrangler dev and Vite, seeds a public table, and runs axe-core on each page.
      # Fails on violations only, and lists what needs review.
      - run: npm run axe:browser -w @canasta/web
